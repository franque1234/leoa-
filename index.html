<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ornamentação Leoa</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #1a1a1a;
      color: #fff;
    }
    header {
      background: linear-gradient(to right, #d4af37, #ff1493);
      padding: 25px;
      text-align: center;
      font-size: 36px;
      font-weight: bold;
      color: #000;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .galeria {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      padding: 30px;
    }
    .galeria img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 12px;
      border: 3px solid #d4af37;
      transition: transform 0.3s, box-shadow 0.3s;
    }
    .galeria img:hover {
      transform: scale(1.05);
      box-shadow: 0 0 15px #ff1493;
    }
    footer {
      background: #000;
      color: #ccc;
      text-align: center;
      padding: 20px;
      font-size: 14px;
    }
    /* Botão WhatsApp flutuante */
    #whatsapp-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background-color: #25d366;
      color: white;
      padding: 15px 20px;
      border-radius: 50px;
      font-size: 16px;
      text-decoration: none;
      box-shadow: 0 0 10px #25d366;
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: bold;
    }
    #whatsapp-btn:hover {
      background-color: #1ebe57;
    }
    #whatsapp-btn svg {
      width: 20px;
      height: 20px;
      fill: white;
    }
  </style>
</head>
<body>

  <header>
    Ornamentação Leoa
  </header>

  <section class="galeria">
    <img src="https://via.placeholder.com/300x200?text=Casamento+Leoa" alt="Casamento" />
    <img src="https://via.placeholder.com/300x200?text=Festa+Pink" alt="Festa Pink" />
    <img src="https://via.placeholder.com/300x200?text=Infantil+Luxo" alt="Infantil" />
    <img src="https://via.placeholder.com/300x200?text=Noite+Dourada" alt="Evento Noturno" />
    <img src="https://via.placeholder.com/300x200?text=Flores+e+Brilho" alt="Flores" />
    <img src="https://via.placeholder.com/300x200?text=Realeza+Rosa" alt="Tema Realeza" />
  </section>

  <footer>
    © 2025 Ornamentação Leoa • WhatsApp: +258 84 000 0000 • Instagram: @leoa.decor
  </footer>

  <a id="whatsapp-btn" href="https://wa.me/258840000000?text=Olá%20gostaria%20de%20saber%20mais%20sobre%20os%20serviços%20de%20ornamentação" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M20.52 3.48A11.8 11.8 0 0012 0C5.37 0 0 5.37 0 12a11.95 11.95 0 001.64 6.17L0 24l5.91-1.55a11.82 11.82 0 006.07 1.55c6.63 0 12-5.37 12-12a11.8 11.8 0 00-3.46-8.52zM12 21.54a9.44 9.44 0 01-4.79-1.37l-.34-.21-3.5.92.94-3.41-.22-.35a9.52 9.52 0 1110.92 4.02 9.46 9.46 0 01-3.01.4zm5.4-7.35c-.3-.15-1.77-.87-2.05-.97-.28-.11-.49-.15-.7.15s-.8.97-.98 1.17-.36.22-.66.07a7.47 7.47 0 01-2.2-1.36 8.48 8.48 0 01-1.57-1.95c-.17-.3 0-.46.13-.61.14-.14.3-.35.45-.52a1.9 1.9 0 00.3-.5.49.49 0 000-.55c-.13-.15-.7-1.68-.96-2.3-.25-.6-.5-.52-.7-.53-.18 0-.38 0-.58 0a1.48 1.48 0 00-1.07.5 4.62 4.62 0 00-1.38 3.2 6.9 6.9 0 001.57 3.56 14.83 14.83 0 004.77 4.6 13.43 13.43 0 002.48 1.06 4.64 4.64 0 002.18.18 3.85 3.85 0 002.36-1.54 3.44 3.44 0 00.27-2.36c-.12-.17-.44-.27-.73-.42z"></path>
    </svg>
    WhatsApp
  </a>

</body>
</html>
